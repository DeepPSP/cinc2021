# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Formatting with black & flake8

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    if: contains(fromJson('["wenh06", "DeepPSP"]'), github.repository_owner)

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # black & flake8 are pure static checks; installing requirements.txt
      # (with its 2021-era pins that have no py3.11 wheels) is unnecessary
      run: |
        python -m pip install --upgrade pip
        python -m pip install black==22.3.0 flake8 # Testing packages
    - name: Check code format with black and flake8
      run: |
        black . --check --extend-exclude .ipynb -v --exclude "/(build|dist|torch_ecg|torch_ecg_bak|official_baseline_classifier|official_scoring_metric/|helper_code\.py|test_model\.py|train_model\.py|evaluate_model\.py|pantompkins\.py|extract_leads_wfdb\.py)"
        flake8 . --count --ignore="E501 W503 E203 F841 E402 E731" --show-source --statistics --exclude=./.*,build,dist,official*,torch_ecg,torch_ecg_bak,pantompkins.py,helper_code.py,test_model.py,train_model.py,evaluate_model.py,extract_leads_wfdb.py,*.ipynb
